name: Publish Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: |
          if [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install;
          elif [ -f "yarn.lock" ]; then yarn install;
          elif [ -f "bun.lockb" ]; then npm install -g bun && bun install;
          else npm ci; fi
        shell: bash

      - name: generate changelog from commit titles
        id: changelog
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          ALL_TAGS=$(git tag -l --sort=-version:refname)
          PREVIOUS_TAG=""
          FOUND_CURRENT=false
          for tag in $ALL_TAGS; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              FOUND_CURRENT=true
            elif [ "$FOUND_CURRENT" = true ]; then
              PREVIOUS_TAG="$tag"
              break
            fi
          done

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" $CURRENT_TAG)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREVIOUS_TAG}..${CURRENT_TAG})
          fi

          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

          echo "release_changelog=$CHANGELOG" >> $GITHUB_OUTPUT
        shell: bash

      - name: build and publish tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: |
            ## Changelog
            ${{ steps.changelog.outputs.release_changelog }}
          releaseDraft: true
          prerelease: false
